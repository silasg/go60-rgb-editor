[tools]
rust = "stable"
"cargo:cargo-llvm-cov" = "latest"
"cargo:git-cliff" = "latest"
"cargo:cargo-release" = "latest"
"cargo:cargo-cyclonedx" = "latest"

[vars]
# Pinned nightly toolchain for cargo-pup (architecture linting).
# cargo-pup hooks into rustc internals, which are only available on nightly.
# Update this together with the cargo_pup_lint_config version in Cargo.toml
# when upgrading cargo-pup.
PUP_NIGHTLY = "nightly-2026-01-22"

[tasks.setup]
description = "One-time setup for dev environment (installs rustup components)"
run = """
rustup component add llvm-tools-preview
rustup target add wasm32-unknown-unknown
rustup toolchain install {{vars.PUP_NIGHTLY}}
rustup component add --toolchain {{vars.PUP_NIGHTLY}} rust-src rustc-dev llvm-tools-preview
NIGHTLY_BIN="$(dirname "$(rustup which --toolchain {{vars.PUP_NIGHTLY}} cargo)")"
PATH="$NIGHTLY_BIN:$PATH" cargo install cargo_pup
cargo install wasm-bindgen-cli --version 0.2.114
"""

[tasks.clean]
description = "Remove all build artifacts"
run = "cargo clean"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks.build-release]
description = "Build optimized release binary"
run = "cargo build --release"

[tasks.test]
description = "Run all tests and clippy"
run = ["cargo clippy -- -D warnings", "cargo test"]

[tasks.tui-e2e]
description = "Run TUI E2E tests"
run = "cargo test --test 'e2e_*'"

[tasks.lint]
description = "Run clippy lints"
run = "cargo clippy -- -D warnings"

[tasks.coverage]
description = "Run tests with coverage report"
run = """
SYSROOT=$(rustup run stable rustc --print sysroot)
HOST=$(rustup run stable rustc -vV | sed -n 's/host: //p')
export LLVM_COV="$SYSROOT/lib/rustlib/$HOST/bin/llvm-cov"
export LLVM_PROFDATA="$SYSROOT/lib/rustlib/$HOST/bin/llvm-profdata"
cargo llvm-cov
"""

[tasks.coverage-html]
description = "Generate HTML coverage report and open in browser"
run = """
SYSROOT=$(rustup run stable rustc --print sysroot)
HOST=$(rustup run stable rustc -vV | sed -n 's/host: //p')
export LLVM_COV="$SYSROOT/lib/rustlib/$HOST/bin/llvm-cov"
export LLVM_PROFDATA="$SYSROOT/lib/rustlib/$HOST/bin/llvm-profdata"
cargo llvm-cov --html && open target/llvm-cov/html/index.html
"""

[tasks.run]
description = "Run the editor with the example config file"
run = "cargo run --bin go60-rgb-editor -- 'Go60 TK Latest RGB scheme.txt'"

[tasks.arch-lint]
description = "Run architecture linting with cargo-pup (requires nightly)"
run = """
cargo test --test architecture -- --nocapture
cargo test -p go60-rgb-editor-domain --test architecture -- --nocapture
NIGHTLY_BIN="$(dirname "$(rustup which --toolchain {{vars.PUP_NIGHTLY}} cargo)")"
PATH="$NIGHTLY_BIN:$PATH" cargo pup
cd crates/domain && PATH="$NIGHTLY_BIN:$PATH" cargo pup
"""

[tasks.build-wasm]
description = "Build domain-wasm for WebAssembly"
run = """
cargo build -p go60-rgb-editor-wasm --target wasm32-unknown-unknown --release
wasm-bindgen --target web --out-dir pkg/ target/wasm32-unknown-unknown/release/go60_rgb_editor_wasm.wasm
"""

[tasks.sbom]
description = "Generate Rust SBOM (CycloneDX JSON)"
run = "cargo cyclonedx --format json --spec-version 1.5 --top-level --override-filename go60-rgb-editor.cdx"

[tasks.sbom-all]
description = "Generate SBOMs for all stacks (Rust + Web)"
depends = ["sbom", "sbom-web"]

[tasks.sbom-web]
description = "Generate web SBOM (CycloneDX JSON)"
depends = ["web-install"]
run = "cd web && npx @cyclonedx/cyclonedx-npm --output-file ../go60-rgb-editor-web.cdx.json"

[tasks.release-build]
description = "Build release binary for a target (set TARGET env var, USE_CROSS=1 for cross)"
run = """
if [ -n "$USE_CROSS" ]; then
  cargo install cross --locked
  cross build --release --target "$TARGET"
else
  rustup target add "$TARGET"
  cargo build --release --target "$TARGET"
fi
"""

[tasks.release-package]
description = "Package release binary + SBOM into archive (set TARGET and VERSION env vars)"
run = """
ARCHIVE_BASE="go60-rgb-editor-${VERSION}-${TARGET}"
cd target/${TARGET}/release
if echo "$TARGET" | grep -q windows; then
  7z a ../../../${ARCHIVE_BASE}.zip go60-rgb-editor.exe
else
  tar czf ../../../${ARCHIVE_BASE}.tar.gz go60-rgb-editor
fi
cd ../../..
mv go60-rgb-editor.cdx.json ${ARCHIVE_BASE}.cdx.json

"""

[tasks.changelog]
description = "Preview unreleased changelog entries"
run = "git cliff --unreleased"

[tasks.release-patch]
description = "Release a patch version (bug fixes)"
run = "cargo release patch --execute"

[tasks.release-minor]
description = "Release a minor version (new features)"
run = "cargo release minor --execute"

[tasks.release-major]
description = "Release a major version (breaking changes)"
run = "cargo release major --execute"

[tasks.web-lint]
description = "Run TypeScript linting (ESLint)"
depends = ["web-install"]
run = "cd web && npx eslint src/"

[tasks.lint-all]
description = "Run linting across all stacks (Rust clippy + TypeScript ESLint)"
depends = ["lint", "web-lint"]

[tasks.web-install]
description = "Install web dependencies"
run = "cd web && npm install"

[tasks.web-dev]
description = "Start web dev server"
depends = ["build-wasm", "web-install"]
run = "cd web && npx vite"

[tasks.web-build]
description = "Build web app for production"
depends = ["build-wasm", "web-install"]
run = "cd web && npx vite build"

[tasks.web-e2e]
description = "Run web E2E tests with Playwright (headless Chrome)"
depends = ["build-wasm", "web-install"]
run = "cd web && npx playwright install chromium && npx playwright test"
