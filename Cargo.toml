[package]
name = "go60-rgb-editor-tui"
version = "0.2.0"
edition = "2021"
description = "TUI RGB Underglow Editor for ZMK Keyboards"
license = "MIT"

[[bin]]
name = "go60-rgb-editor"
path = "src/main.rs"

[workspace]
members = [".", "crates/domain", "crates/domain-wasm"]

[dependencies]
go60-rgb-editor-domain = { path = "crates/domain" }
ratatui = "0.28"
crossterm = "0.28"
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
cargo_pup_lint_config = "0.1.5"
