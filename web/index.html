<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go60 RGB Editor</title>
</head>
<body>
  <section id="hero">
    <h1 class="hero-title">🎨 Go60 RGB Editor</h1>
    <p class="hero-tagline">Visual RGB underglow editor for MoErgo Go60 keyboards (ZMK / TailorKey).<br>Paint per-key colors, manage layers, export config — right in your browser.</p>
    <div class="hero-badges">
      <a href="https://github.com/silasg/go60-rgb-editor/actions/workflows/ci.yml"><img src="https://github.com/silasg/go60-rgb-editor/actions/workflows/ci.yml/badge.svg" alt="CI"></a>
      <a href="https://github.com/silasg/go60-rgb-editor/releases"><img src="https://img.shields.io/github/v/release/silasg/go60-rgb-editor" alt="GitHub Release"></a>
      <img src="https://img.shields.io/github/stars/silasg/go60-rgb-editor?style=social" alt="GitHub Stars">
      <img src="https://img.shields.io/badge/rust-1.70%2B-orange" alt="Rust 1.70+">
    </div>
    <div class="hero-links">
      <a href="https://github.com/silasg/go60-rgb-editor" target="_blank" rel="noopener">GitHub</a>
      <span class="hero-sep">·</span>
      <a href="https://github.com/silasg/go60-rgb-editor/releases" target="_blank" rel="noopener">Releases (TUI)</a>
    </div>
  </section>

  <div id="app">
    <header id="header">
      <h1>Go60 RGB Editor</h1>
      <div id="toolbar"></div>
    </header>

    <main id="main">
      <aside id="layer-panel">
        <h2>Layers</h2>
        <div id="layer-list"></div>
        <div id="layer-actions"></div>
      </aside>

      <section id="editor-panel">
        <div id="palette-section">
          <div id="palette-colors">
            <h3>Colors</h3>
            <div id="palette-regular" class="swatch-grid"></div>
          </div>
          <div id="palette-locks">
            <h3>Locks</h3>
            <div id="palette-lock-grid" class="swatch-grid"></div>
          </div>
          <div id="palette-aliases">
            <h3>Aliases</h3>
            <div id="palette-alias-grid" class="swatch-grid"></div>
          </div>

        </div>

        <div id="keyboard-section">
          <div id="keyboard-left" class="keyboard-half">
            <span class="half-label">Left</span>
          </div>
          <div id="keyboard-right" class="keyboard-half">
            <span class="half-label">Right</span>
          </div>
        </div>

        <div id="config-section">
          <div id="config-header">
            <h3>Device Tree Config</h3>
            <div id="config-actions">
              <button id="copy-config-btn" class="config-action-btn" title="Copy config to clipboard">📋 Copy</button>
              <button id="paste-config-btn" class="config-action-btn" title="Paste config from clipboard">📥 Paste</button>
            </div>
            <span id="parse-status"></span>
          </div>
          <textarea id="config-text" placeholder="Paste your TailorKey RGB config here..." spellcheck="false"></textarea>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
