name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: jdx/mise-action@v4

      - name: Setup
        run: mise run setup

      - name: Build
        run: mise run build

      - name: Lint (all stacks)
        run: mise run lint-all

      - name: Test
        run: mise run test

      - name: TUI E2E tests
        run: mise run tui-e2e

      - name: Web E2E tests
        run: mise run web-e2e

      - name: Architecture lint
        run: mise run arch-lint

      - name: Coverage
        run: mise run coverage

      - name: Generate SBOMs
        run: mise run sbom-all

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            go60-rgb-editor.cdx.json
            go60-rgb-editor-web.cdx.json
