name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build release
        run: mise run release-build
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross && '1' || '' }}

      - name: Generate SBOM
        run: mise run sbom

      - name: Package release
        run: mise run release-package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: go60-rgb-editor-${{ github.ref_name }}-${{ matrix.target }}
          path: go60-rgb-editor-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            go60-rgb-editor-${{ github.ref_name }}-*.tar.gz
            go60-rgb-editor-${{ github.ref_name }}-*.zip
            go60-rgb-editor-${{ github.ref_name }}-*.cdx.json
